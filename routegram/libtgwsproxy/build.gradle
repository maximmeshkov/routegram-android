// Unmodified Flowseal + CPython, packaged independently of Telegram.
// All upstream versions and artifact checksums live in upstream.json.

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

repositories {
    mavenCentral()
    google()
}

def proxyAbis = (findProperty('routegramProxyAbis') ?: 'arm64-v8a,armeabi-v7a,x86_64').split(',')

android {
    namespace 'com.routegram.wsproxy'
    compileSdkVersion 36
    ndkVersion '27.2.12479018'
    useLibrary 'android.test.runner', false
    useLibrary 'android.test.base', false

    defaultConfig {
        minSdkVersion 28
        targetSdkVersion 35
        consumerProguardFiles 'consumer-rules.pro'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
        ndk { abiFilters.addAll(proxyAbis) }
    }

    // Зеркалим кастомные buildType'ы upstream — чтобы variant-matching разрешился,
    // когда приложение через :routegram:glue потянет этот модуль.
    buildTypes {
        standalone {}
        HA_private {}
        HA_public {}
        HA_hardcore {}
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets.main.jniLibs.srcDirs += "$buildDir/pythonRuntime/jniLibs"
    sourceSets.main.assets.srcDirs += "$buildDir/pythonRuntime/assets"
    packagingOptions { jniLibs { useLegacyPackaging true } }
}

task buildPythonProxy(type: Exec) {
    workingDir projectDir
    commandLine([findProperty('routegramPython') ?: 'python', 'tools/build.py'] +
            proxyAbis.collectMany { ['--abi', it] })
    inputs.files fileTree(projectDir) {
        include 'upstream.json', 'tools/*.py', 'tools/Dockerfile', 'src/main/c/**', 'src/main/python/**'
    }
    inputs.property 'abis', proxyAbis.join(',')
    outputs.dir "$buildDir/pythonRuntime"
}
preBuild.dependsOn buildPythonProxy

dependencies {
    implementation project(':routegram:core')
    implementation 'net.java.dev.jna:jna:5.19.1@aar'
}
